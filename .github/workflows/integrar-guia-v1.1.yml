name: Integrar ayuda V1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrar-guia-v1.1.yml'
      - 'guia.js'
      - 'guia.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar recursos de ayuda en index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="guia.css">'
          js = '<script src="guia.js"></script>'
          if css not in s:
              s = s.replace('</head>', f'  {css}\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', f'  {js}\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Guardar integración
        run: |
          if git diff --quiet -- index.html; then
            echo "La ayuda ya está integrada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: activar instructivo y modo guiado V1.1 [skip ci]"
          git push
